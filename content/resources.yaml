  - { name: "keanekwa/MathUwU (full-stack quant quiz app)", url: "https://github.com/keanekwa/MathUwU", license: "MIT", reuse: "code-with-attribution" }
  - { name: "ctt062/quant-question-bank", url: "https://github.com/ctt062/quant-question-bank", license: "MIT", reuse: "with-attribution" }
