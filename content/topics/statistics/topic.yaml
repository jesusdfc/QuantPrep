id: statistics
name: Statistics & Statistical Rigor
order: 2
weight: 0.25
description: >
  The most heavily weighted section. Descriptive statistics, sampling and the CLT,
  inference and hypothesis testing, regression, time-series statistics, and — most
  importantly — statistical rigor: multiple testing, p-hacking, backtest overfitting,
  and distinguishing real signal from artifact.
subtopics:
