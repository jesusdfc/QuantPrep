  - { id: inference, name: "Hypothesis Testing & Confidence Intervals" }
  - { id: multiple-testing, name: "Multiple Testing & FDR" }
  - { id: regression, name: "Regression & OLS Diagnostics" }
  - { id: time-series, name: Time-Series Statistics }
  - { id: rigor, name: "Statistical Rigor & Research Traps" }
