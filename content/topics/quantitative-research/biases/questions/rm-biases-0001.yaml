id: rm-biases-0001
title: Survivorship Bias in a Backtest
topic: quantitative-research
subtopic: biases
difficulty: easy
tags: [survivorship-bias, universe-selection, backtest]
locked: false
source: { name: original, url: null, license: original }
prompt: |
  You backtest a strategy on the *current* members of the S&P 500 over the last 20 years and
  get excellent returns. Why is this result likely overstated, and how do you fix the study?
hints:
  - Which companies are in today's index, and which are missing?
  - Think about the firms that were delisted, went bankrupt, or dropped out.
solution: |
  Today's index members are **survivors** — firms that grew and stayed successful enough to
  remain in the index. Companies that went bankrupt, were delisted, or shrank out of the
  index are absent from your universe entirely. Backtesting on current members therefore
  bakes in the future knowledge that these names would do well, inflating returns and
  understating risk (you never held the losers).

  **Fixes:**
  - Use a **point-in-time** universe: at each date, include exactly the constituents *as of
    that date*, including names later delisted.
  - Use a survivorship-bias-free dataset that retains dead securities and their final
    returns.
  - Confirm that index reconstitutions and corporate actions are handled without look-ahead.

  Survivorship bias is one of the most common ways a backtest looks great and then fails
  live. Interviewers expect you to flag it immediately.
answer: "Current members exclude delisted/bankrupt firms — use a point-in-time, survivorship-bias-free universe"
