id: rm-robustness-0001
title: Statistical vs Economic Significance
topic: quantitative-research
subtopic: robustness
difficulty: easy
tags: [economic-significance, transaction-costs, p-value, effect-size]
locked: false
source: { name: original, url: null, license: original }
prompt: |
  Your signal predicts next-day returns with a p-value of 0.001. Does that mean the strategy
  is profitable? Explain the difference between statistical and economic significance.
hints:
  - A tiny effect can be statistically significant with enough data.
  - Consider the size of the edge relative to transaction costs and capacity.
solution: |
  No. A small p-value tells you the effect is unlikely to be *exactly zero*; it says nothing
  about whether the effect is **large enough to trade profitably**.

  - **Statistical significance** — is the effect distinguishable from zero given the noise?
    With a large sample, even an economically trivial effect (say $0.1$ bp/day) can have
    $p < 0.001$.
  - **Economic significance** — is the effect big enough to matter after **transaction
    costs, slippage, capacity, and risk**? A $0.1$ bp/day edge is obliterated by realistic
    costs of several bps per trade.

  The correct evaluation compares the **effect size** (expected return per unit turnover) to
  the **cost of harvesting it**, and asks whether the net Sharpe / net return justifies the
  risk and capital. A highly significant but tiny edge is often unprofitable. Report effect
  sizes and post-cost performance, not just p-values.
answer: "No — significance ≠ profitability; compare the effect size to transaction costs, capacity, and risk (net-of-cost performance)"
