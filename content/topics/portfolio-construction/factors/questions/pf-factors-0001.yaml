id: pf-factors-0001
title: Is Your Alpha Just Beta?
topic: portfolio-construction
subtopic: factors
difficulty: medium
tags: [factor-models, capm, fama-french, alpha, factor-neutrality]
locked: false
source: { name: original, url: null, license: original }
prompt: |
  Your long-short strategy returns 12% per year and you call it alpha. How would you check
  whether it is genuine alpha or just compensated exposure to known factors (market, size,
  value, momentum)? What regression do you run and what do you look at?
hints:
  - Regress strategy returns on factor returns; the intercept is the "alpha".
  - Check both the size/significance of the intercept and the factor loadings.
solution: |
  Run a time-series **factor regression** of the strategy's excess returns $r_t$ on the
  factor returns (e.g. Fama-French-Carhart):
  $$
  r_t = \alpha + \beta_{\text{mkt}} \text{MKT}_t + \beta_{\text{smb}} \text{SMB}_t
        + \beta_{\text{hml}} \text{HML}_t + \beta_{\text{mom}} \text{MOM}_t + \varepsilon_t.
  $$
  

  What to examine:
  - **Intercept $\alpha$** — the return unexplained by the factors. Genuine alpha needs a
    positive, economically meaningful, and statistically significant $\hat\alpha$ (with
    robust / HAC standard errors).
  - **Factor loadings $\beta$** — if the $12\%$ is mostly $\beta_{\text{mom}} \times$ momentum
    premium, it is a repackaged factor bet you could buy cheaply, not skill.
  - **$R^2$** — high $R^2$ with near-zero $\alpha$ means the strategy is essentially a factor
    portfolio.

  If $\hat\alpha$ collapses to insignificance once factors are included, the "alpha" was
  factor exposure. This is the standard way interviewers probe whether you can separate skill
  from beta.
answer: "Regress strategy returns on factor returns; genuine alpha is a significant intercept after controlling for factor loadings"
