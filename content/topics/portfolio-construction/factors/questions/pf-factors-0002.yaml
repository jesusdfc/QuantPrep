id: pf-factors-0002
title: Accidental Factor Exposures and Neutralization
topic: portfolio-construction
subtopic: factors
difficulty: medium
tags: [factor-exposure, beta-hedging, factor-neutral, alpha, attribution]
locked: false
source: { name: original, url: null, license: original }
prompt: |
  Your long-short "alpha" strategy quietly makes money mostly when value outperforms growth.
  Explain how to detect such accidental factor exposure, why it matters, and how to neutralize
  it. What is the risk of over-neutralizing?
hints:
  - Regress strategy returns on factor returns to see what you're really loading on.
  - Neutralization can be done ex-ante (in construction) or ex-post (hedging).
solution: |
  **Detect.** Regress the strategy's returns on a set of factor returns (market, size, value,
  momentum, quality, plus sector dummies):
  $$
  r_t = \alpha + \sum_k \beta_k f_{k,t} + \varepsilon_t.
  $$
  
  Significant $\beta_k$ (e.g. a large positive value loading) means the "alpha" is partly
  **factor beta in disguise**. The intercept $\alpha$ is the residual return not explained by
  known factors; that is the part worth paying for.

  **Why it matters.** Factor exposure is **cheap beta** (replicable with a factor ETF), not
  skill; it can dominate P&L and impose unwanted risk that blows up in factor drawdowns (e.g.
  a value crash). You may be **unknowingly** taking a large, uncompensated bet and mislabeling
  it alpha.

  **Neutralize.**
  - **Ex-ante (construction):** impose constraints so portfolio factor loadings ≈ 0 (dollar-,
    beta-, sector-neutral); build within factor/sector buckets; orthogonalize signals against
    factors before sizing.
  - **Ex-post (hedging):** short the offending factor/beta via futures/ETFs to strip the
    exposure.

  **Risk of over-neutralizing.** Neutralizing **too many** factors can remove genuine signal
  (if your edge is legitimately related to a factor), add turnover and cost, and — because
  factor loadings are **estimated with error** — hedging on noisy betas can *introduce* risk
  rather than remove it. Neutralize the exposures you don't intend to take, keep the ones that
  are part of the thesis, and use robust/shrunk loading estimates.
answer: "Regress strategy returns on factor (and sector) returns; significant betas mean the 'alpha' is factor beta, with true skill in the intercept. Neutralize ex-ante via constraints/orthogonalization or ex-post via hedging. Over-neutralizing removes real signal, adds cost/turnover, and hedging on noisy betas can add risk."
