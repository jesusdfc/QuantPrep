id: sql-windows-0001
title: First Three Trades per Stock
topic: sql
subtopic: windows
difficulty: medium
tags: [window-functions, row-number, partition-by, top-n]
locked: false
source: { name: original, url: null, license: original }
prompt: |
  Given a table `trades(symbol TEXT, ts TIMESTAMP, price NUMERIC, qty INT)`, write a query
  that returns the **first three trades** (by timestamp) for every symbol.
hints:
  - Number rows within each symbol using ROW_NUMBER() with a PARTITION BY.
  - You cannot filter a window function in WHERE — wrap it in a subquery or CTE.
solution: |
  Rank trades within each symbol by time, then keep ranks 1–3:

  ```sql
  WITH ranked AS (
    SELECT
      symbol, ts, price, qty,
      ROW_NUMBER() OVER (PARTITION BY symbol ORDER BY ts) AS rn
    FROM trades
  )
  SELECT symbol, ts, price, qty
  FROM ranked
  WHERE rn <= 3
  ORDER BY symbol, ts;
  ```

  Key points:
  - `PARTITION BY symbol` restarts the numbering for each stock.
  - `ROW_NUMBER` breaks ties arbitrarily; use `RANK`/`DENSE_RANK` if you want tied timestamps
    to share a rank.
  - The window function runs *after* `WHERE`, so you must compute `rn` in a CTE/subquery and
    filter it in the outer query.
answer: "Use ROW_NUMBER() OVER (PARTITION BY symbol ORDER BY ts) in a CTE, then filter rn <= 3"
