id: ml-core-0002
title: L1 vs L2 Regularization
topic: machine-learning
subtopic: core
difficulty: easy
tags: [regularization, lasso, ridge, feature-selection, multicollinearity]
locked: false
source: { name: original, url: null, license: original }
prompt: |
  Contrast L1 (Lasso) and L2 (Ridge) regularization. Why does L1 produce sparse solutions
  while L2 does not? When would you prefer each for a factor model with many correlated
  predictors?
hints:
  - "Picture the constraint region: a diamond (L1) vs a circle (L2)."
  - Think about what each does to a group of highly correlated features.
solution: |
  Both add a penalty to the loss: Ridge adds $\lambda\sum_j \beta_j^2$, Lasso adds
  $\lambda\sum_j |\beta_j|$.

  - **Sparsity.** Geometrically, the L1 constraint region is a diamond with **corners on the
    axes**; the loss contours tend to touch it at a corner, setting some coefficients exactly
    to zero. The L2 region is a smooth ball with no corners, so it shrinks coefficients
    toward zero but rarely to exactly zero.

  - **Correlated predictors.** Lasso tends to **pick one** feature from a correlated group
    and zero the rest (unstable choice among near-duplicates). Ridge **spreads** weight across
    correlated features and is more stable under multicollinearity.

  **For a factor model with many correlated predictors:** if you want automatic feature
  selection / a parsimonious model, use **Lasso** (or Elastic Net to get sparsity while
  handling correlated groups more gracefully). If predictors are highly collinear and you
  care about stable coefficients and prediction, prefer **Ridge** (or Elastic Net). Elastic
  Net, mixing both penalties, is often the pragmatic choice.
answer: "L1's corner points zero out coefficients (sparse selection); L2 shrinks smoothly and is stable under collinearity; Elastic Net blends both"
