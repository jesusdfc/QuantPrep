id: ml-models-0001
title: Why Does Random Forest Reduce Variance?
topic: machine-learning
subtopic: models
difficulty: medium
tags: [random-forest, bagging, variance-reduction, decorrelation, trees]
locked: false
source: { name: original, url: null, license: original }
prompt: |
  A single deep decision tree is low-bias but high-variance. Explain how a random forest
  reduces variance, and why randomly restricting the features considered at each split
  matters (beyond plain bagging).
hints:
  - Averaging B i.i.d. estimators divides variance by B; but trees are not independent.
  - Consider the variance of an average of correlated variables.
solution: |
  Averaging $B$ estimators each with variance $\sigma^2$ and pairwise correlation $\rho$ has
  variance
  $$\rho\,\sigma^2 + \frac{1-\rho}{B}\,\sigma^2.$$
  As $B \to \infty$ the second term vanishes, leaving $\rho\sigma^2$. So the benefit of
  averaging is **capped by the correlation** between the trees, not just their number.

  - **Bagging** (bootstrap-sampling the rows) trains each tree on a different resample,
    reducing variance — but the trees remain correlated because a few strong predictors
    dominate the top splits in every tree.
  - **Random feature subsetting** at each split forces trees to use different predictors,
    **lowering $\rho$**. Reducing $\rho$ shrinks the irreducible $\rho\sigma^2$ floor, so the
    ensemble variance drops further than bagging alone.

  Net effect: forests keep the low bias of deep trees while decorrelating them to cut
  variance. The bias is roughly unchanged; the gain is almost entirely variance reduction.
answer: "Averaging correlated trees has variance ρσ² + (1−ρ)σ²/B; feature subsetting lowers ρ, cutting the variance floor beyond bagging"
