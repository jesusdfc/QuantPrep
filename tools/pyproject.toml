[project]
name = "quantprep-tools"
version = "0.1.0"
description = "QuantPrep content pipeline: validation, indexing, and ingestion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21.0",
]

[project.scripts]
qp-validate = "quantprep_tools.validate_content:main"
qp-build = "quantprep_tools.build_index:main"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["quantprep_tools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
